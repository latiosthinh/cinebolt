<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineBolt TV</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Sora:wght@400;800&display=swap">
<style>
/* Layout: 10-foot UI. Floating glass tab bar over a full-bleed hero, then horizontal shelves that scroll under focus. Dark-only by design (living-room TV). */
:root{
  --bg:#07080b; --surface:#14161c; --glass:rgba(40,42,50,.55); --fg:#f4f5f7; --muted:#9a9ea9;
  --accent:#ffb53d; --focus:#ffffff;
  --display:"Be Vietnam Pro","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail:64px; --gutter:max(16px,4vw); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus{outline:none}

/* ---------- Top tab bar ---------- */
.nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);transition:opacity .35s,transform .35s;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.nav.dim{opacity:.0;transform:translate(-50%,-30px);pointer-events:none}
.tab{padding:10px 22px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.tab.sel{color:var(--fg)}
.tab.sel::after{content:"";display:block;height:2px;margin:4px auto 0;width:16px;border-radius:2px;background:var(--fg);opacity:.5}
.tab.f{background:var(--focus);color:#000;transform:scale(1.06)}
.tab.f::after{background:#000}
.clock{position:fixed;top:calc(env(safe-area-inset-top,0px) + 30px);right:var(--gutter);z-index:20;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- Hero ---------- */
.hero{position:relative;height:min(78vh,760px);min-height:440px;overflow:hidden}
.hero-art{position:absolute;inset:-4%;transition:opacity .9s ease;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,1%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,11,.92) 0%,rgba(7,8,11,.55) 38%,transparent 70%),linear-gradient(0deg,var(--bg) 0%,transparent 40%)}
.hero-body{position:absolute;z-index:2;left:var(--gutter);right:var(--gutter);bottom:12%;max-width:640px;display:flex;flex-direction:column;gap:16px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,92px);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:15px;font-weight:500}
.badge{border:1px solid currentColor;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.04em}
.hero p{margin:0;color:#cfd2d9;font-size:17px;line-height:1.55;max-width:56ch}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font-weight:600;font-size:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(20px);transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.btn.primary{background:rgba(255,255,255,.92);color:#000}
.btn.f{background:var(--focus);color:#000;transform:scale(1.08);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.btn svg{width:18px;height:18px}
.dots{display:flex;gap:8px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:width .3s,background .3s}
.dots i.on{width:22px;border-radius:4px;background:var(--fg)}

/* ---------- Shelves ---------- */
main{position:relative;z-index:3;margin-top:-60px;padding-bottom:80px;display:flex;flex-direction:column;gap:34px}
.shelf h2{margin:0 0 4px;padding-left:var(--gutter);font-size:21px;font-weight:700;letter-spacing:-.01em}
.track{display:flex;gap:26px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:22px var(--gutter) 30px;scroll-padding-inline:var(--gutter)}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;text-align:left;position:relative;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.art{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);transition:box-shadow .28s,transform .28s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.art::before{content:"";position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--sx,30%) var(--sy,0%),rgba(255,255,255,.35),transparent 55%)}
.land .art{width:clamp(220px,22vw,340px);aspect-ratio:16/9}
.post .art{width:clamp(130px,12vw,190px);aspect-ratio:2/3}
.wide .art{width:clamp(280px,30vw,460px);aspect-ratio:21/9}
.card.f .art{transform:scale(1.1) translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 26px 50px rgba(0,0,0,.7)}
.card.f .art::before{opacity:1}
.card.f .cap{transform:none}
.cap{display:flex;flex-direction:column;gap:3px;transition:none;max-width:100%}
.cap b{font-size:15px;font-weight:600}
.cap span{font-size:13px;color:var(--muted)}
.post .cap{display:none}
.title-art{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.land .title-art{font-size:clamp(18px,1.8vw,26px)}
.post .title-art{font-size:clamp(16px,1.5vw,22px);align-items:center;justify-content:center;text-align:center}
.wide .title-art{font-size:clamp(22px,2.4vw,36px)}
.progress{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);z-index:3}
.progress i{display:block;height:100%;border-radius:2px;background:var(--fg)}
.land .progress~.title-art{padding-bottom:24px}
.rank{position:absolute;top:8px;left:10px;font-family:var(--display);font-weight:800;font-size:44px;color:rgba(255,255,255,.9);z-index:3;text-shadow:0 4px 20px rgba(0,0,0,.6)}

/* ---------- Details overlay ---------- */
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .4s}
.detail.open{opacity:1;pointer-events:auto}
.detail .hero{height:100%;min-height:0}
.detail .hero-body{bottom:auto;top:50%;transform:translateY(-50%);max-width:700px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:10px;max-width:640px}
.facts div{font-size:13px;color:var(--muted);line-height:1.5}
.facts b{display:block;color:var(--fg);font-size:14px;font-weight:600}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:var(--gutter);z-index:50;font-size:12px;color:var(--muted);background:var(--glass);backdrop-filter:blur(16px);padding:8px 12px;border-radius:10px}
.hint kbd{font-family:var(--body);font-weight:700;color:var(--fg)}
@media (max-width:600px){.clock{display:none}.tab{padding:9px 14px;font-size:14px}.hero-body{bottom:16%}.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
/* Startup splash: painted with the first frame, removed once the home screen has fully settled (no visible layout shift). */
.splash{position:fixed;inset:0;z-index:100;background:#07080b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .35s ease}
.splash img{width:72px;height:72px}
.splash-bar{width:120px;height:3px;border-radius:3px;background:#ffffff1a;overflow:hidden}
.splash-bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#FF5A1F,#FFB53D);animation:splash-sweep 1.1s ease-in-out infinite}
@keyframes splash-sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.splash.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><img src="logo.svg" alt=""><div class="splash-bar"><i></i></div></div>
<div class="brand" aria-hidden="true"><img src="logo.svg" alt="" width="30" height="30"><span>Cine<b>Bolt</b></span></div>
<nav aria-label="Điều hướng chính" class="nav" id="nav"></nav>
<div class="clock" id="clock"></div>

<section class="hero" id="hero">
  <div class="hero-art" id="heroArt"></div>
  <div class="hero-body">
    <div class="kicker" id="hKick"></div>
    <h1 id="hTitle"></h1>
    <div class="meta" id="hMeta"></div>
    <p id="hDesc"></p>
    <div class="actions" id="hActions"></div>
    <div class="dots" id="dots"></div>
  </div>
</section>
<div id="searchPanel" hidden><label for="searchInput">Tìm phim</label><input id="searchInput" type="search" placeholder="Nhập tên phim…" autocomplete="off" readonly tabindex="-1"><div class="kb" id="searchKeys" role="group" aria-label="Bàn phím"></div><p id="searchStatus" role="status">Gõ tên phim, không cần dấu.</p></div>
<section id="viewLoading" class="view-loading" role="status" hidden>
  <div class="loading-heading"><span class="spinner" aria-hidden="true"></span><span id="viewLoadingText">Đang tải phim…</span></div>
  <div class="skeleton-feature" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="skeleton-row" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</section>
<main id="shelves" aria-label="Danh sách phim"></main>

<div class="filter-popup-overlay" id="filterPopup" role="dialog" aria-modal="true" aria-label="Bộ lọc" aria-hidden="true" inert hidden>
  <div class="filter-popup-backdrop" data-action="closePopup"></div>
  <div class="filter-popup-panel" id="filterPopupPanel">
    <div class="filter-popup-title" id="filterPopupTitle"></div>
    <div class="filter-popup-list" id="filterPopupList" role="menu" tabindex="-1"></div>
  </div>
</div>

<div class="filter-popup-overlay" id="readMoreOverlay" role="dialog" aria-modal="true" aria-label="Toàn bộ mô tả" aria-hidden="true" inert hidden>
  <div class="filter-popup-backdrop" data-action="closeReadMore"></div>
  <div class="read-more-panel" id="readMorePanel">
    <div class="read-more-title" id="readMoreTitle"></div>
    <div class="read-more-body" id="readMoreBody" tabindex="-1"></div>
    <div class="read-more-hint">Nhấn OK hoặc Esc để đóng · ↑ ↓ để cuộn</div>
  </div>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true" inert>
  <button class="player-button detail-back" data-action="closeDetail" aria-label="Quay lại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>Quay lại</span></button>
  <section class="hero">
    <div class="hero-art" id="dArt"></div>
    <div class="hero-body">
      <div class="d-info">
        <div class="kicker" id="dKick"></div>
        <h1 id="dTitle"></h1>
        <div class="meta" id="dMeta"></div>
        <div class="desc-wrap">
          <p id="dDesc"></p>
          <button id="dMore" class="btn compact read-more-btn" data-action="readMore" hidden>Xem thêm</button>
        </div>
        <div class="actions" id="dActions"></div>
        <div class="facts" id="dFacts"></div>
        <div id="detailStatus" class="detail-status" role="status" hidden></div>
      </div>
      <section class="episodes" id="dEpisodes" aria-label="Danh sách tập" hidden></section>
    </div>
  </section>
</div>

<div class="hint" style="display:none"><kbd>← ↑ → ↓</kbd> di chuyển · <kbd>Enter</kbd> chọn · <kbd>Esc</kbd> quay lại</div>

<div class="player" id="player" tabindex="-1" role="dialog" aria-modal="true" aria-label="Trình phát phim" aria-hidden="true" inert>
  <video id="video" playsinline autoplay tabindex="-1"></video>
  <div class="player-shade" aria-hidden="true"></div>
  <div class="player-top" id="playerTop">
    <button class="player-button" id="playerClose" aria-label="Quay lại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>Quay lại</span></button>
    <div><span class="player-eyebrow">ĐANG XEM</span><h2 id="playerTitle"></h2></div>
  </div>
  <div role="status" class="playback-status" id="playerLoading" hidden><span class="spinner" aria-hidden="true"></span><span id="playerLoadingText">Đang tải phim…</span><button class="player-button" id="playerRetry" hidden>Thử lại</button></div>
  <div class="player-controls" id="playerControls">
    <div class="timeline-labels"><span id="playerElapsed">0:00</span><span id="playerDuration">--:--</span></div>
    <input id="playerSeek" type="range" min="0" max="100" value="0" step="1" aria-label="Vị trí phát" aria-valuetext="Chưa có thời lượng" disabled>
    <div class="player-buttons">
      <div class="transport">
        <button class="player-button" id="playerBack5" aria-label="Lùi 5 phút"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 13.4A7.6 7.6 0 1 0 6.9 6.6"/><path d="M3.6 3.8v4.6h4.6"/><text x="12.4" y="15.6" text-anchor="middle" font-size="8.4" font-weight="800" fill="currentColor" stroke="none">5′</text></svg><span>−5 phút</span></button>
        <button class="player-button" id="playerBack1" aria-label="Lùi 1 phút"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 13.4A7.6 7.6 0 1 0 6.9 6.6"/><path d="M3.6 3.8v4.6h4.6"/><text x="12.4" y="15.6" text-anchor="middle" font-size="8.4" font-weight="800" fill="currentColor" stroke="none">1′</text></svg><span>−1 phút</span></button>
        <button class="player-button" id="playerRewind" aria-label="Lùi 10 giây"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 13.4A7.6 7.6 0 1 0 6.9 6.6"/><path d="M3.6 3.8v4.6h4.6"/><text x="12.4" y="15.6" text-anchor="middle" font-size="8.4" font-weight="800" fill="currentColor" stroke="none">10</text></svg><span>−10 giây</span></button>
        <button class="player-button play-toggle" id="playerToggle" aria-label="Tạm dừng"></button>
        <button class="player-button" id="playerForward" aria-label="Tiến 10 giây"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13.4A7.6 7.6 0 1 1 17.1 6.6"/><path d="M20.4 3.8v4.6h-4.6"/><text x="11.6" y="15.6" text-anchor="middle" font-size="8.4" font-weight="800" fill="currentColor" stroke="none">10</text></svg><span>+10 giây</span></button>
        <button class="player-button" id="playerFwd1" aria-label="Tiến 1 phút"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13.4A7.6 7.6 0 1 1 17.1 6.6"/><path d="M20.4 3.8v4.6h-4.6"/><text x="11.6" y="15.6" text-anchor="middle" font-size="8.4" font-weight="800" fill="currentColor" stroke="none">1′</text></svg><span>+1 phút</span></button>
        <button class="player-button" id="playerFwd5" aria-label="Tiến 5 phút"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13.4A7.6 7.6 0 1 1 17.1 6.6"/><path d="M20.4 3.8v4.6h-4.6"/><text x="11.6" y="15.6" text-anchor="middle" font-size="8.4" font-weight="800" fill="currentColor" stroke="none">5′</text></svg><span>+5 phút</span></button>
        <button class="player-button" id="playerMute" aria-label="Tắt tiếng"></button>
        <button class="player-button" id="playerHide" aria-label="Ẩn điều khiển" title="Ẩn điều khiển"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 9 8 8 8-8M4 4h16"/></svg><span>Ẩn</span></button>
      </div>
      <p class="remote-help">↑ thanh thời gian · giữ ← → tua nhanh</p>
    </div>
  </div>
</div>
<style>
.player{position:fixed;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
.player.open{opacity:1;pointer-events:auto}
.player video{width:100%;height:100%;object-fit:contain}
.player-close{position:absolute;top:20px;right:20px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;color:#fff}
.player-close svg{width:20px;height:20px}
.player-close:hover{background:rgba(255,255,255,.24)}
.player-title{position:absolute;top:24px;left:24px;z-index:2;font-size:18px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.player-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);z-index:1}
.player.loaded .player-loading{display:none}
</style>

<script src="hls.min.js"></script>
<script src="app.js"></script>
<script src="player.js"></script>

<style>
body{margin:0}
.nav.dim{opacity:1;transform:translateX(-50%);pointer-events:auto}.clock{display:none}
.hero{height:auto;min-height:560px}.hero-body{position:relative;left:auto;right:auto;bottom:auto;padding:150px var(--gutter) 100px;max-width:850px}
.hero h1{font-size:clamp(32px,5vw,68px);line-height:1.18;overflow-wrap:anywhere}.hero p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero::after{background:linear-gradient(90deg,rgba(7,8,11,.96),rgba(7,8,11,.65) 55%,rgba(7,8,11,.25)),linear-gradient(0deg,var(--bg),transparent 60%)}
.meta{color:#c2c6d0}.card{padding:0;width:clamp(220px,22vw,340px)}.post .card{width:clamp(130px,12vw,190px)}.wide .card{width:clamp(280px,30vw,460px)}
.art{width:100%!important}.cap b{line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cap span{line-height:1.5}.post .cap{display:flex}.post .title-art{align-items:flex-end;font-size:18px}.title-art{line-height:1.35}
.card.f .art{transform:scale(1.035)}.card.f .cap{transform:none}.hint{pointer-events:none;z-index:30}
.detail{overflow-y:auto}.detail .hero{min-height:100%;height:auto}.detail .hero-body{top:auto;transform:none;max-width:900px;padding-top:64px;padding-bottom:64px}.detail p{display:block;overflow:visible}
#searchPanel{padding:115px var(--gutter) 80px}#searchPanel label{display:block;font-size:24px;font-weight:700;margin-bottom:16px}#searchInput{width:100%;max-width:720px;padding:16px;border:1px solid #747b8d;border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;font-size:18px}#searchStatus{color:var(--muted)}
.empty{padding:24px var(--gutter);line-height:1.6;color:#c2c6d0}.player-loading{pointer-events:none;padding:80px;text-align:center}.player-close{width:52px;height:52px}.player-title{max-width:calc(100% - 110px)}
[hidden]{display:none!important}#hero[hidden]~main{margin-top:0;padding-top:110px}#hero[hidden]~#searchPanel:not([hidden])~main{padding-top:0}.tab[aria-current="page"]{color:white;background:rgba(255,255,255,.12)}
@media(max-width:600px){.nav{top:12px;justify-content:flex-start;width:calc(100% - 24px)}.tab{padding:10px 13px}.hero{min-height:0}.hero-body{padding-top:110px;padding-bottom:100px}.actions{gap:8px}.btn{padding:12px 16px;min-height:48px}.detail .hero-body{padding-top:40px}.hero h1{font-size:34px}.hint{display:none!important}}

</style>
